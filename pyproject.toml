[project]
name = "pit-data-platform"
version = "0.1.0"
description = "Point-in-time (bitemporal) economic data platform with lookahead-safe forecasting"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.1", "polars>=1.0", "pyarrow>=15", "pyyaml>=6", "numpy>=1.26", "scikit-learn>=1.4"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
